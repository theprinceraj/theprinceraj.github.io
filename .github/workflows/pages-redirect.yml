# The site itself is deployed by Vercel at theprinceraj.in.
# GitHub Pages only serves a redirect from prince.is-a.dev to theprinceraj.in. It stays enabled because
# this repo holds the prince.is-a.dev domain that other repos' Pages sites (e.g. /qoody/) are served under.
name: Deploy Pages redirect

on:
  push:
    branches: ["main"]
    paths:
      - ".github/pages-redirect/**"
      - ".github/workflows/pages-redirect.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.github/pages-redirect
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
